openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: waitlist
    description: Waitlist operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /waitlist:
    post:
      operationId: submitWaitlist
      tags: [waitlist]
      summary: Join the waitlist
      description: Captures an early-access request from the landing page.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitlistRequest"
      responses:
        "200":
          description: Already subscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistResponse"
        "201":
          description: Added to the waitlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    WaitlistRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: The email address to notify when Heartloom launches.
        name:
          type: string
          description: Optional display name for the submission.
        source:
          type: string
          description: Optional source tag for analytics.
      required:
        - email
    WaitlistEntry:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: [string, 'null']
        source:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - name
        - source
        - createdAt
    WaitlistResponse:
      type: object
      properties:
        message:
          type: string
        created:
          type: boolean
        total:
          type: integer
        entry:
          $ref: "#/components/schemas/WaitlistEntry"
      required:
        - message
        - created
        - total
        - entry
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        code:
          type: string
      required:
        - message
        - code

