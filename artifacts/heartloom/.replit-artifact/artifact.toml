kind = "web"
previewPath = "/"
title = "Heartloom"
version = "1.0.0"
id = "artifacts/heartloom"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24209

[services.development]
run = "pnpm --filter @workspace/heartloom run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/heartloom", "run", "build" ]
publicDir = "artifacts/heartloom/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24209"
BASE_PATH = "/"
